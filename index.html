<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#075c2b"><title>FIT FORMULA — Billing</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root{--green:#075c2b;--lime:#65b52d;--ink:#10251a;--muted:#647169;--line:#dce6df;--paper:#fff;--bg:#f4f7f4;--danger:#c83232}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:720px;margin:auto;padding:env(safe-area-inset-top) 14px calc(248px + env(safe-area-inset-bottom))}.topbar{display:flex;align-items:center;gap:11px;padding:13px 2px 16px}.logo{width:44px;height:44px;border-radius:12px;object-fit:cover;object-position:center;background:white;border:1px solid var(--line)}.brand{font-weight:800;letter-spacing:.2px}.brand small{display:block;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.8px}.status{margin-left:auto;background:#e6f4e9;color:var(--green);padding:6px 9px;border-radius:999px;font-size:12px;font-weight:700}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;margin:0 0 13px;overflow:hidden;box-shadow:0 2px 8px #18372108}.section-head{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 8px}.section-head h2{font-size:15px;margin:0}.section-head span{font-size:12px;color:var(--muted)}.grid{display:grid;gap:10px;padding:8px 16px 16px}.grid.two{grid-template-columns:1fr 1fr}.full{grid-column:1/-1}label{display:block;font-size:12px;font-weight:700;margin:0 0 5px;color:#3b4d41}input,textarea,button{font:inherit}input,textarea{width:100%;border:1px solid #cddad0;border-radius:10px;padding:11px 10px;color:var(--ink);background:#fff;outline:none}input:focus,textarea:focus{border-color:var(--lime);box-shadow:0 0 0 3px #65b52d20}textarea{min-height:58px;resize:vertical}.items{padding:0 12px 14px}.item{border:1px solid var(--line);border-radius:13px;margin:9px 0;padding:11px;background:#fbfdfb}.item-top{display:flex;gap:8px;align-items:center}.item-top input{font-weight:650}.remove{border:0;background:#fff0f0;color:var(--danger);border-radius:9px;width:39px;height:39px;font-size:20px;flex:0 0 auto}.row3{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;margin-top:9px}.amount{font-weight:800;color:var(--green);font-size:14px}.add{width:calc(100% - 24px);margin:0 12px 14px;border:1px dashed #68a979;color:var(--green);background:#f4fbf5;padding:11px;border-radius:11px;font-weight:750}.summary{padding:4px 16px 16px}.summary div{display:flex;justify-content:space-between;padding:5px 0;color:var(--muted)}.summary .total{margin-top:5px;padding:12px 0 0;border-top:1px dashed var(--line);color:var(--ink);font-size:19px;font-weight:850}.actions{position:fixed;z-index:2;bottom:0;left:0;right:0;background:#fffefef2;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:10px max(14px,calc((100vw - 720px)/2 + 14px)) calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{border:0;border-radius:12px;padding:13px 9px;font-weight:800;color:white;background:var(--green);min-height:47px}.btn:disabled{opacity:.48;cursor:not-allowed}.btn.alt{background:#eff6ef;color:var(--green);border:1px solid #cfe1d2}.btn.share{background:#28a645}.history{padding:0 12px 14px}.history-search{margin:0 4px 7px;width:calc(100% - 8px)}.history-item{display:flex;gap:10px;align-items:center;padding:12px 5px;border-bottom:1px solid var(--line)}.history-item:last-child{border:0}.history-item strong,.history-item small{display:block}.history-item small{color:var(--muted);font-size:12px}.history-amt{margin-left:auto;text-align:right}.text-btn{background:none;border:0;color:var(--green);font-weight:750;padding:2px}.empty{color:var(--muted);text-align:center;padding:18px}.settings{padding:0 16px 16px}.settings summary{font-weight:750;color:var(--green);cursor:pointer;padding-top:5px}.settings .grid{padding:13px 0 0}dialog{border:0;border-radius:16px;padding:12px;width:min(94vw,640px);box-shadow:0 18px 60px #10251a66;background:white}dialog::backdrop{background:#10251a99}.dialog-close{display:block;margin-left:auto;border:0;background:var(--green);color:white;border-radius:50%;width:36px;height:36px;font-size:23px;line-height:1}.dialog-close+img{display:block;width:100%;height:auto;margin-top:8px;border:1px solid var(--line)}@media(max-width:390px){.grid.two{grid-template-columns:1fr}.row3{grid-template-columns:1fr 1fr}.row3 div:first-child{grid-column:span 2}}@media(min-width:700px){.app{padding-top:24px}}
  </style>
</head>
<body><main class="app">
 <header class="topbar"><img class="logo" src="assets/ifit-logo.jpeg" alt="FIT FORMULA logo"><div class="brand">FIT FORMULA<small>NUTRITION STORE · BILLING</small></div><span class="status" id="generationStatus">Draft invoice</span></header>
 <section class="card"><div class="section-head"><h2>Invoice details</h2><span id="invoiceLabel"></span></div><div class="grid two"><div><label for="date">Invoice date</label><input id="date" type="date"></div><div><label for="invoiceNo">Invoice number</label><input id="invoiceNo" readonly></div></div></section>
 <section class="card"><div class="section-head"><h2>Customer</h2><span>Optional address</span></div><div class="grid two"><div class="full"><label for="customerName">Customer name *</label><input id="customerName" placeholder="Enter customer name"></div><div><label for="mobile">Mobile number</label><input id="mobile" inputmode="numeric" maxlength="10" placeholder="10-digit number"></div><div class="full"><label for="address">Address</label><textarea id="address" placeholder="Customer address"></textarea></div></div></section>
 <section class="card"><div class="section-head"><h2>Products</h2><span>Tap + to add more</span></div><div class="items" id="items"></div><button class="add" id="addItem" type="button">＋ Add another product</button></section>
 <section class="card"><div class="section-head"><h2>Bill summary</h2><span>Final amount</span></div><div class="summary"><div><span>Subtotal</span><strong id="subtotal">₹0.00</strong></div><div><span>Total discount</span><strong id="discount">− ₹0.00</strong></div><div class="total"><span>Payable amount</span><span id="total">₹0.00</span></div></div></section>
 <section class="card"><div class="section-head"><h2>Business details</h2><span>Edit once, saved here</span></div><div class="settings"><details><summary>Set store / payment details</summary><div class="grid two"><div class="full"><label for="businessName">Store name</label><input id="businessName" value="FIT FORMULA NUTRITION STORE"></div><div class="full"><label for="businessAddress">Store address</label><textarea id="businessAddress" placeholder="Add your store address">MB Rd, Raja Nagar, Kolar, Karnataka 563101</textarea></div><div><label for="businessMobile">Store mobile</label><input id="businessMobile" inputmode="numeric" value="092060 14393" placeholder="Store contact"></div><div><label for="upi">UPI ID</label><input id="upi" placeholder="yourname@upi"></div><div class="full"><label for="terms">Terms / note</label><textarea id="terms" placeholder="Thank you for shopping with us.">Thank you for shopping with us.</textarea></div></div></details></div></section>
 <section class="card"><div class="section-head"><h2>Saved invoices</h2><button class="text-btn" id="exportBtn" type="button">Export backup</button></div><div class="history"><input class="history-search" id="historySearch" placeholder="Search customer or invoice number"><div id="history"></div></div></section>
</main><nav class="actions"><button class="btn" id="pdfBtn" type="button">Generate invoice</button><button class="btn alt" id="viewImageBtn" type="button" disabled>View invoice image</button><button class="btn alt" id="saveImageBtn" type="button" disabled>Save invoice image</button><button class="btn share" id="shareBtn" type="button" disabled>WhatsApp share image</button><button class="btn alt" id="contactBtn" type="button">Save store contact</button><button class="btn alt" id="saveBtn" type="button" disabled>Download PDF</button><button class="btn alt" id="printBtn" type="button" disabled>Print</button></nav><dialog id="imageDialog"><button class="dialog-close" id="closeImageBtn" type="button" aria-label="Close image preview">×</button><img id="invoiceImagePreview" alt="Generated FIT FORMULA invoice image"></dialog>
<script>
const $=id=>document.getElementById(id), STORAGE='ifitBillingV1', SETTINGS='ifitBillingSettingsV1'; let lastPdf=null, logoDataUrl=null, sealDataUrl=null;
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
function nextNo(){const a=JSON.parse(localStorage.getItem(STORAGE)||'[]');let n=a.reduce((m,x)=>Math.max(m,Number((x.invoiceNo||'').match(/(\d+)$/)?.[1]||0)),0)+1;return 'IFIT-INV-'+String(n).padStart(4,'0')}
function row(p={name:'',qty:1,rate:'',discount:0}){let e=document.createElement('div');e.className='item';e.innerHTML=`<div class="item-top"><input class="pname" value="${esc(p.name)}" placeholder="Product name"><button class="remove" title="Remove product" type="button">×</button></div><div class="row3"><div><label>Quantity</label><input class="qty" type="number" min="1" inputmode="decimal" value="${p.qty}"></div><div><label>Rate (₹)</label><input class="rate" type="number" min="0" inputmode="decimal" value="${p.rate}"></div><div><label>Discount (₹)</label><input class="disc" type="number" min="0" inputmode="decimal" value="${p.discount}"></div></div><div class="amount">Line total: <span>₹0.00</span></div>`;e.querySelectorAll('input').forEach(x=>x.addEventListener('input',calculate));e.querySelector('.remove').onclick=()=>{if(document.querySelectorAll('.item').length>1){e.remove();calculate()}};$('items').append(e);calculate()}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function products(){return [...document.querySelectorAll('.item')].map(e=>({name:e.querySelector('.pname').value.trim(),qty:+e.querySelector('.qty').value||0,rate:+e.querySelector('.rate').value||0,discount:+e.querySelector('.disc').value||0}))}
function calculate(){let sub=0,dis=0;[...document.querySelectorAll('.item')].forEach((e,i)=>{let p=products()[i],gross=p.qty*p.rate,d=Math.min(p.discount,gross);sub+=gross;dis+=d;e.querySelector('.amount span').textContent=money(gross-d)});$('subtotal').textContent=money(sub);$('discount').textContent='− '+money(dis);$('total').textContent=money(sub-dis)}
function form(){let ps=products().filter(p=>p.name&&p.qty>0);let sub=ps.reduce((s,p)=>s+p.qty*p.rate,0),discount=ps.reduce((s,p)=>s+Math.min(p.discount,p.qty*p.rate),0);return {invoiceNo:$('invoiceNo').value,date:$('date').value,customerName:$('customerName').value.trim(),mobile:$('mobile').value.trim(),address:$('address').value.trim(),products:ps,subtotal:sub,discount,total:sub-discount,createdAt:new Date().toISOString()}}
function valid(){let f=form();if(!f.customerName){alert('Please enter the customer name.');$('customerName').focus();return false}if(!f.products.length){alert('Add at least one product with its name, quantity and rate.');return false}return true}
function saveSettings(){let s={};['businessName','businessAddress','businessMobile','upi','terms'].forEach(id=>s[id]=$(id).value);localStorage.setItem(SETTINGS,JSON.stringify(s));return s}
function save(){if(!valid())return false;let f=form(),a=JSON.parse(localStorage.getItem(STORAGE)||'[]'),i=a.findIndex(x=>x.invoiceNo===f.invoiceNo);if(i>-1)a[i]=f;else a.unshift(f);localStorage.setItem(STORAGE,JSON.stringify(a));saveSettings();renderHistory();alert('Invoice saved on this device.');return f}
function renderHistory(){let q=$('historySearch').value.toLowerCase(),a=JSON.parse(localStorage.getItem(STORAGE)||'[]').filter(x=>(x.invoiceNo+x.customerName+x.mobile).toLowerCase().includes(q));$('history').innerHTML=a.length?a.map(x=>`<div class="history-item"><div><strong>${esc(x.customerName)}</strong><small>${x.invoiceNo} · ${new Date(x.date+'T00:00').toLocaleDateString('en-IN')}</small></div><div class="history-amt"><strong>${money(x.total)}</strong><button class="text-btn" onclick="loadInvoice('${x.invoiceNo}')">Open</button></div></div>`).join(''):'<div class="empty">No saved invoices yet.</div>'}
window.loadInvoice=no=>{let x=JSON.parse(localStorage.getItem(STORAGE)||'[]').find(i=>i.invoiceNo===no);if(!x)return;$('invoiceNo').value=x.invoiceNo;$('date').value=x.date;$('customerName').value=x.customerName;$('mobile').value=x.mobile;$('address').value=x.address;$('items').innerHTML='';x.products.forEach(row);scrollTo({top:0,behavior:'smooth'})}
async function loadLogo(){if(logoDataUrl)return logoDataUrl;return new Promise(resolve=>{let image=new Image();image.onload=()=>{let c=document.createElement('canvas');c.width=image.naturalWidth;c.height=image.naturalHeight;c.getContext('2d').drawImage(image,0,0);logoDataUrl=c.toDataURL('image/jpeg');resolve(logoDataUrl)};image.onerror=()=>resolve(null);image.src='assets/ifit-logo.jpeg'})}
async function loadSeal(){if(sealDataUrl)return sealDataUrl;return new Promise(resolve=>{let image=new Image();image.onload=()=>{let c=document.createElement('canvas');c.width=image.naturalWidth;c.height=image.naturalHeight;c.getContext('2d').drawImage(image,0,0);sealDataUrl=c.toDataURL('image/jpeg');resolve(sealDataUrl)};image.onerror=()=>resolve(null);image.src='assets/ifit-seal.jpeg'})}
async function generatePdf(download=true){if(!valid())return null;saveSettings();if(!window.jspdf){alert('PDF library did not load. Check internet once, then retry.');return null}let f=form(),s=saveSettings(),{jsPDF}=window.jspdf,doc=new jsPDF({unit:'mm',format:'a4'}),y=15,logo=await loadLogo(),seal=await loadSeal();doc.setFillColor(7,92,43);doc.rect(0,0,210,32,'F');if(logo){doc.setFillColor(255);doc.roundedRect(174,4,25,25,2,2,'F');doc.addImage(logo,'JPEG',175,5,23,23)}doc.setTextColor(255);doc.setFontSize(19);doc.setFont('helvetica','bold');doc.text(s.businessName||'FIT FORMULA NUTRITION STORE',14,16);doc.setFontSize(8);doc.setFont('helvetica','normal');doc.text('NUTRITION STORE · CUSTOMER INVOICE',14,23);doc.setTextColor(16,37,26);doc.setFontSize(9);y=42;doc.setFont('helvetica','bold');doc.text('BILL TO',14,y);doc.text('INVOICE',145,y);doc.setFont('helvetica','normal');doc.setFontSize(10);doc.text(f.customerName,14,y+7);let cust=[f.mobile,f.address].filter(Boolean);doc.setFontSize(8);cust.forEach((t,i)=>doc.text(t,14,y+13+i*5));doc.setFontSize(9);doc.text(f.invoiceNo,145,y+7);doc.text(new Date(f.date+'T00:00').toLocaleDateString('en-IN'),145,y+13);y=70;doc.setFillColor(239,246,239);doc.rect(14,y,182,8,'F');doc.setFont('helvetica','bold');doc.setFontSize(8);doc.text('#',17,y+5);doc.text('PRODUCT',27,y+5);doc.text('QTY',122,y+5,{align:'right'});doc.text('RATE',151,y+5,{align:'right'});doc.text('AMOUNT',192,y+5,{align:'right'});y+=14;doc.setFont('helvetica','normal');f.products.forEach((p,i)=>{if(y>244){doc.addPage();y=18}let amt=p.qty*p.rate-Math.min(p.discount,p.qty*p.rate);doc.text(String(i+1),17,y);doc.text(p.name.slice(0,45),27,y);doc.text(String(p.qty),122,y,{align:'right'});doc.text(money(p.rate),151,y,{align:'right'});doc.text(money(amt),192,y,{align:'right'});if(p.discount>0){doc.setFontSize(7);doc.setTextColor(100);doc.text('Discount: '+money(p.discount),27,y+4);doc.setTextColor(16,37,26);doc.setFontSize(8);y+=4}y+=8});y+=3;doc.line(120,y,196,y);doc.setFontSize(9);doc.text('Subtotal',150,y+7,{align:'right'});doc.text(money(f.subtotal),192,y+7,{align:'right'});doc.text('Discount',150,y+13,{align:'right'});doc.text('− '+money(f.discount),192,y+13,{align:'right'});doc.setFillColor(7,92,43);doc.rect(120,y+18,76,11,'F');doc.setTextColor(255);doc.setFont('helvetica','bold');doc.setFontSize(11);doc.text('TOTAL',125,y+25);doc.text(money(f.total),192,y+25,{align:'right'});doc.setTextColor(16,37,26);doc.setFont('helvetica','normal');let foot=Math.max(y+42,264);doc.setFontSize(8);let details=[s.businessAddress,s.businessMobile&&'Phone: '+s.businessMobile,s.upi&&'UPI: '+s.upi].filter(Boolean);details.forEach((t,i)=>doc.text(t,14,foot+i*4));if(seal)doc.addImage(seal,'JPEG',148,foot-18,22,22);doc.setFont('helvetica','bold');doc.text('Authorized signature',155,foot+8);doc.setFont('helvetica','normal');doc.text(s.terms||'Thank you for shopping with us.',14,foot+16);doc.setDrawColor(101,181,45);doc.line(14,286,196,286);doc.setFontSize(7);doc.text('Generated digitally by FIT FORMULA Billing',105,291,{align:'center'});lastPdf={doc,filename:f.invoiceNo+'.pdf',invoice:f};if(download)doc.save(lastPdf.filename);return lastPdf}
async function share(){let p=await generatePdf(false);if(!p)return;let text=`FIT FORMULA Invoice ${p.invoice.invoiceNo}\nCustomer: ${p.invoice.customerName}\nAmount: ${money(p.invoice.total)}`;let file=new File([p.doc.output('blob')],p.filename,{type:'application/pdf'});if(navigator.share&&navigator.canShare?.({files:[file]})){try{await navigator.share({title:'FIT FORMULA Invoice',text,files:[file]});return}catch(e){if(e.name==='AbortError')return}}window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank')}
async function printInvoice(){let p=await generatePdf(false);if(!p)return;let url=URL.createObjectURL(p.doc.output('blob'));let w=window.open(url,'_blank');if(w)w.onload=()=>w.print();else alert('Please allow pop-ups to print the invoice.')}
function exportBackup(){let data={exportedAt:new Date().toISOString(),invoices:JSON.parse(localStorage.getItem(STORAGE)||'[]'),business:JSON.parse(localStorage.getItem(SETTINGS)||'{}')},a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='ifit-billing-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}
function init(){let s=JSON.parse(localStorage.getItem(SETTINGS)||'{}');Object.entries(s).forEach(([k,v])=>$(k).value=v);$('date').value=new Date().toISOString().slice(0,10);$('invoiceNo').value=nextNo();$('invoiceLabel').textContent=$('invoiceNo').value;row();$('addItem').onclick=()=>row();$('saveBtn').onclick=save;$('pdfBtn').onclick=()=>generatePdf(true);$('shareBtn').onclick=share;$('printBtn').onclick=printInvoice;$('exportBtn').onclick=exportBackup;$('historySearch').oninput=renderHistory;renderHistory()}init();
</script><script src="app.js"></script></body></html>
