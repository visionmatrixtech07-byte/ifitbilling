<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#075c2b">
<title>FIT FORMULA — Billing</title>
<style>
:root{--green:#075c2b;--lime:#65b52d;--ink:#10251a;--muted:#647169;--line:#dce6df;--paper:#fff;--bg:#f4f7f4;--danger:#c83232}
*{box-sizing:border-box}
.hidden{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:720px;margin:auto;padding:env(safe-area-inset-top) 14px calc(250px + env(safe-area-inset-bottom))}
.topbar{display:flex;align-items:center;gap:11px;padding:13px 2px 16px}
.logo{width:44px;height:44px;border-radius:12px;object-fit:contain;background:#fff;border:1px solid var(--line)}
.brand{font-weight:800;letter-spacing:.2px}
.brand small{display:block;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.8px}
.status{margin-left:auto;background:#e6f4e9;color:var(--green);padding:6px 9px;border-radius:999px;font-size:12px;font-weight:700}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;margin:0 0 13px;overflow:hidden;box-shadow:0 2px 8px #18372108}
.section-head{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 8px}
.section-head h2{font-size:15px;margin:0}
.section-head span{font-size:12px;color:var(--muted)}
.grid{display:grid;gap:10px;padding:8px 16px 16px}
.grid.two{grid-template-columns:1fr 1fr}
.full{grid-column:1/-1}
label{display:block;font-size:12px;font-weight:700;margin:0 0 5px;color:#3b4d41}
input,textarea,button{font:inherit}
input,textarea{width:100%;border:1px solid #cddad0;border-radius:10px;padding:11px 10px;color:var(--ink);background:#fff;outline:none}
input:focus,textarea:focus{border-color:var(--lime);box-shadow:0 0 0 3px #65b52d20}
textarea{min-height:58px;resize:vertical}
.items{padding:0 12px 14px}
.item{border:1px solid var(--line);border-radius:13px;margin:9px 0;padding:11px;background:#fbfdfb}
.item-top{display:flex;gap:8px;align-items:center}
.item-top input{font-weight:650}
.remove{border:0;background:#fff0f0;color:var(--danger);border-radius:9px;width:39px;height:39px;font-size:20px;flex:0 0 auto}
.row3{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;margin-top:9px}
.amount{font-weight:800;color:var(--green);font-size:14px;margin-top:8px}
.add{width:calc(100% - 24px);margin:0 12px 14px;border:1px dashed #68a979;color:var(--green);background:#f4fbf5;padding:11px;border-radius:11px;font-weight:750}
